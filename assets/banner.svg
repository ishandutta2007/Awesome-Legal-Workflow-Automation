<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 350"><defs><linearGradient id="bg-gradient" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0f172a"/><stop offset="50%" stop-color="#1e1b4b"/><stop offset="100%" stop-color="#0f172a"/></linearGradient><linearGradient id="accent-purple" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#8b5cf6"/><stop offset="100%" stop-color="#d946ef"/></linearGradient><linearGradient id="accent-blue" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="100%" stop-color="#6366f1"/></linearGradient><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="8"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter></defs><style>@keyframes pulse-glow{0%{opacity:.4;transform:scale(1)}50%{opacity:.8;transform:scale(1.05)}}@keyframes float-node{0%{transform:translateY(0)}50%{transform:translateY(-8px)}}.badge-text,.subtitle,.title{font-family:system-ui,-apple-system,BlinkMacSystemFont,&apos;Segoe UI&apos;,Roboto,sans-serif}.title{font-weight:800;font-size:48px;fill:#fff}.subtitle{font-weight:400;font-size:20px;fill:#94a3b8}.badge-text{font-weight:600;font-size:14px;fill:#38bdf8}.pulsing-orb{animation:pulse-glow 4s ease-in-out infinite;transform-origin:center}.flow-line{stroke-dasharray:8 8;animation:dash-flow 2s linear infinite}.node-1{animation:float-node 3.5s ease-in-out infinite}.node-2{animation:float-node 4.2s ease-in-out infinite .5s}.node-3{animation:float-node 3.8s ease-in-out infinite 1s}</style><rect width="1200" height="350" fill="url(#bg-gradient)" rx="16"/><circle cx="150" cy="80" r="120" fill="#6366f1" class="pulsing-orb" filter="url(#glow)" opacity=".3"/><circle cx="1050" cy="270" r="140" fill="#d946ef" class="pulsing-orb" filter="url(#glow)" opacity=".25"/><g stroke="#fff" stroke-opacity=".04" stroke-width="1"><line x1="0" x2="1200" y1="70" y2="70"/><line x1=
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 350" width="100%" height="100%">
  <defs>
    <!-- Dark Tech Gradient -->
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="accent-purple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#d946ef"/>
    </linearGradient>

    <linearGradient id="accent-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-weight: 800;
      font-size: 48px;
      fill: #ffffff;
    }
    .subtitle {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-weight: 400;
      font-size: 20px;
      fill: #94a3b8;
    }
    .badge-text {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-weight: 600;
      font-size: 14px;
      fill: #38bdf8;
    }
    
    /* CSS Animations */
    @keyframes pulse-glow {
      0%, 100% { opacity: 0.4; transform: scale(1); }
      50% { opacity: 0.8; transform: scale(1.05); }
    }

    @keyframes dash-flow {
      to { stroke-dashoffset: -40; }
    }

    @keyframes float-node {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }

    .pulsing-orb {
      animation: pulse-glow 4s ease-in-out infinite;
      transform-origin: center;
    }

    .flow-line {
      stroke-dasharray: 8 8;
      animation: dash-flow 2s linear infinite;
    }

    .node-1 { animation: float-node 3.5s ease-in-out infinite; }
    .node-2 { animation: float-node 4.2s ease-in-out infinite 0.5s; }
    .node-3 { animation: float-node 3.8s ease-in-out infinite 1s; }
  </style>

  <!-- Background Layer -->
  <rect width="1200" height="350" rx="16" fill="url(#bg-gradient)"/>

  <!-- Decorative Animated Orbs -->
  <circle class="pulsing-orb" cx="150" cy="80" r="120" fill="#6366f1" filter="url(#glow)" opacity="0.3"/>
  <circle class="pulsing-orb" cx="1050" cy="270" r="140" fill="#d946ef" filter="url(#glow)" opacity="0.25"/>

  <!-- Background Grid Pattern -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="70" x2="1200" y2="70"/>
    <line x1="0" y1="140" x2="1200" y2="140"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="280" x2="1200" y2="280"/>
    <line x1="200" y1="0" x2="200" y2="350"/>
    <line x1="400" y1="0" x2="400" y2="350"/>
    <line x1="600" y1="0" x2="600" y2="350"/>
    <line x1="800" y1="0" x2="800" y2="350"/>
    <line x1="1000" y1="0" x2="1000" y2="350"/>
  </g>

  <!-- Animated Workflow Graphic (Right Side) -->
  <g transform="translate(750, 45)">
    <!-- Connection Lines -->
    <path class="flow-line" d="M 60 70 L 160 130 L 260 80" stroke="#38bdf8" stroke-width="3" fill="none" opacity="0.8"/>
    <path class="flow-line" d="M 160 130 L 220 210" stroke="#8b5cf6" stroke-width="3" fill="none" opacity="0.8"/>

    <!-- Workflow Node 1: Intake (Gavel/Scale Icon Node) -->
    <g class="node-1" transform="translate(60, 70)">
      <rect x="-35" y="-35" width="70" height="70" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="2" filter="url(#glow)"/>
      <!-- Scale Icon -->
      <path d="M-12 -5 L12 -5 M0 -12 L0 12 M-12 5 L-16 12 M-12 5 L-8 12 M12 5 L8 12 M12 5 L16 12" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" fill="none"/>
    </g>

    <!-- Workflow Node 2: Decision Tree/AI Node -->
    <g class="node-2" transform="translate(160, 130)">
      <rect x="-40" y="-40" width="80" height="80" rx="18" fill="#1e293b" stroke="#a855f7" stroke-width="2.5" filter="url(#glow)"/>
      <!-- Gear/Automation Icon -->
      <circle cx="0" cy="0" r="10" stroke="#d946ef" stroke-width="2.5" fill="none"/>
      <path d="M0 -16 L0 -10 M0 10 L0 16 M-16 0 L-10 0 M10 0 L16 0" stroke="#d946ef" stroke-width="2.5" stroke-linecap="round"/>
    </g>

    <!-- Workflow Node 3: Resolution/Doc Gen Node -->
    <g class="node-3" transform="translate(260, 80)">
      <rect x="-35" y="-35" width="70" height="70" rx="14" fill="#1e293b" stroke="#4ade80" stroke-width="2" filter="url(#glow)"/>
      <!-- Checkmark/Doc Icon -->
      <path d="M-10 2 L-3 9 L12 -6" stroke="#4ade80" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    </g>

    <!-- Workflow Node 4: Action/E-sign Node -->
    <g class="node-1" transform="translate(220, 210)">
      <rect x="-30" y="-30" width="60" height="60" rx="12" fill="#1e293b" stroke="#f43f5e" stroke-width="2" filter="url(#glow)"/>
      <!-- Pen/Sign Icon -->
      <path d="M-8 8 L8 -8 M4 -8 L8 -8 L8 -4" stroke="#f43f5e" stroke-width="2" stroke-linecap="round" fill="none"/>
    </g>
  </g>

  <!-- Left Content Area -->
  <g transform="translate(80, 100)">
    <!-- Pill Category Badge -->
    <rect x="0" y="0" width="260" height="32" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="130" y="21" text-anchor="middle" class="badge-text">⚖️ LEGALTECH &amp; LEGALOPS</text>

    <!-- Main Title -->
    <text x="0" y="85" class="title">Awesome Legal Workflow</text>
    <text x="0" y="140" class="title" fill="url(#accent-purple)">Automation Ecosystem</text>

    <!-- Subtitle -->
    <text x="0" y="185" class="subtitle">Curated SaaS Platforms, AI Agents &amp; Open-Source Workflow Engines</text>
  </g>
</svg>
